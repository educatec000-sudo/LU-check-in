<style>:root{
  --bg:#fdf8f4; --card:#ffffff; --ink:#3a2a24; --muted:#96827a; --line:#f0e3d9;
  --pri:#b8435c; --pri2:#e08a9b; --pri-soft:#fbeef1; --gold:#c9a24b; --rose:#e08a9b; --olive:#75854c; --cocoa:#4a3226; --ok:#16a34a; --ok-soft:#e3f6e9;
  --warn:#d97706; --warn-soft:#fef3dd; --bad:#dc2626; --bad-soft:#fdeaea;
  --teal:#0d9488; --teal-soft:#dcf5f2; --r:16px; --sh:0 10px 30px rgba(28,30,70,.08);
  --sh-sm:0 3px 12px rgba(28,30,70,.08);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Ubuntu,"Helvetica Neue",Arial,sans-serif;background:radial-gradient(1200px 500px at 85% -5%,#fbeef1 0%,transparent 60%),radial-gradient(900px 420px at -10% 20%,#faf0e6 0%,transparent 55%),var(--bg);color:var(--ink);min-height:100vh}
a{color:var(--pri);text-decoration:none}
::selection{background:#f6dbe1}
.brand,h1,h2,h3,.modal-h h3,.pass-body .who{font-family:Georgia,'Times New Roman',serif;letter-spacing:-.2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#e0b3bd;border-radius:8px;border:2px solid #fdf8f4}
::-webkit-scrollbar-track{background:transparent}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid #eec3cd}
.topbar-in{max-width:1120px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 0 0 1.5px #f0e3d9;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand{font-weight:800;font-size:18px;letter-spacing:-.3px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.topnav{margin-left:auto;display:flex;gap:8px;align-items:center}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(58,42,36,.05),0 14px 34px rgba(58,42,36,.07)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 16px;font-weight:600;letter-spacing:.2px;box-shadow:0 1px 2px rgba(58,42,36,.07);transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh-sm)}
.btn:active{transform:none}
.btn-pri{background:linear-gradient(135deg,#a83a52,#d9536d);color:#fff;border:none;box-shadow:0 6px 16px rgba(168,58,82,.30),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-ok{background:var(--ok);color:#fff;border:none}
.btn-bad{background:#fff;color:var(--bad);border-color:#f3c2c2}
.btn-ghost{background:transparent;border-color:transparent;color:var(--pri)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn-lg{padding:14px 22px;font-size:16px;border-radius:14px}
.btn-block{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.icon{width:16px;height:16px;flex:none}
.hero{background:linear-gradient(135deg,#241612,#4a3226 60%,#6b4a35);color:#fff;border-radius:22px;padding:34px 30px;box-shadow:var(--sh);position:relative;overflow:hidden;border:1px solid rgba(244,194,205,.28)}
.hero h1{margin:0 0 8px;font-size:clamp(24px,4vw,36px);letter-spacing:-.8px}
.hero p{margin:0 0 18px;opacity:.9;max-width:640px}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(224,90,110,.25)}
.hero::before{content:"";position:absolute;right:60px;bottom:-90px;width:170px;height:170px;border-radius:50%;background:rgba(117,133,76,.22)}
/* guia de passos removido — tela inicial limpa */
.sec-head{display:flex;align-items:center;gap:12px;margin:26px 0 12px;border-bottom:1px solid var(--line);padding-bottom:10px}
.sec-head h2{margin:0;font-size:20px;letter-spacing:-.4px}
.sec-head .sp{margin-left:auto}
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ev-card{padding:18px;display:flex;flex-direction:column;gap:10px;transition:transform .18s,box-shadow .18s}
.ev-card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(58,42,36,.06),0 18px 40px rgba(168,58,82,.12)}
.ev-card h3{margin:0;font-size:18px}
.ev-meta{color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:3px}
.ev-bar{height:8px;background:#f9edea;border-radius:99px;overflow:hidden}
.ev-bar i{display:block;height:100%;background:linear-gradient(90deg,#c1354f,#f0a0ae);border-radius:99px}
.ev-stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:99px;padding:5px 11px;background:#f9edea;color:#6b4a45;border:1px solid rgba(107,74,69,.12)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.pri{background:var(--pri-soft);color:var(--pri)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.ev-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:8px}
.ev-head{padding:22px;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.ev-head h1{margin:0;font-size:24px;letter-spacing:-.5px}
.ev-head .meta{color:var(--muted);font-size:14px;margin-top:6px}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;min-width:130px;box-shadow:var(--sh-sm);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#c1354f,#f0a0ae)}
.stat b{font-size:24px;display:block}
.stat span{color:var(--muted);font-size:12.5px;font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}
.toolbar input[type=search]{flex:1;min-width:200px;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:#fff}
.seg{display:flex;background:#f4dfe3;border-radius:12px;padding:4px;gap:2px;box-shadow:inset 0 1px 3px rgba(58,42,36,.08)}
.seg button{border:none;background:transparent;padding:8px 14px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh-sm)}
.tbl-wrap{overflow:auto;border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;background:#fff;font-size:14px;min-width:860px}
.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:12px;border-bottom:1px solid var(--line);background:#fdf6f4;position:sticky;top:0}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:#fdf6f4}
.tbl .nm{font-weight:700}
.tbl .sub{color:var(--muted);font-size:12.5px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:700;background:#f9edea;border:1px dashed #e3b7c0;border-radius:8px;padding:3px 8px;font-size:13px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}
.dot.g{background:var(--ok)} .dot.o{background:#e3b7c0}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap}
.mini{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.mini:hover{border-color:var(--pri);color:var(--pri)}
.fab{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;gap:10px}
.modal-bg{position:fixed;inset:0;background:rgba(18,20,40,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:#fffdfb;border-radius:24px;max-width:640px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 24px 70px rgba(43,26,20,.30);animation:pop .18s;border:1px solid #f3ddd9}
.modal.wide{max-width:860px}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#fffdfb}
.modal-h h3{margin:0;font-size:18px}
.modal-b{padding:20px 22px}
.modal-f{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:#fffdfb}
.x{margin-left:auto;border:none;background:#f9edea;width:32px;height:32px;border-radius:10px;font-size:16px;line-height:1}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#fffdfb;box-shadow:inset 0 1px 2px rgba(58,42,36,.05);transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px #f6dbe1}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ffiltros{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}
@media(max-width:560px){.f2{grid-template-columns:1fr}}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
#toast-root{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:94vw}
.toast{background:#3a2a24;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 14px 34px rgba(0,0,0,.30);animation:pop .2s;max-width:94vw;text-align:center}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--bad)}
.drop{border:2px dashed #e3b7c0;border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted);background:#fdf6f4;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
@media(max-width:560px){.map-grid{grid-template-columns:1fr}}
.map-grid select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px}
.prev-tbl{font-size:12.5px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.prev-tbl table{width:100%;border-collapse:collapse}
.prev-tbl th,.prev-tbl td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.prev-tbl th{background:#fdf6f4;color:var(--muted)}
.qr-box{background:#fffdfb;border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
.qr-box canvas,.qr-box img{max-width:100%;border-radius:8px}
.scan-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
@media(max-width:900px){.scan-layout{grid-template-columns:1fr}}
.cam{position:relative;background:#141013;border-radius:18px;overflow:hidden;min-height:340px;display:flex;align-items:center;justify-content:center;color:#fff}
.cam video{width:100%;max-height:520px;object-fit:cover;display:block}
.cam .frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.frame .box{width:min(64vw,280px);height:min(64vw,280px);border:3px solid rgba(255,255,255,.85);border-radius:18px;box-shadow:0 0 0 4000px rgba(5,6,15,.45)}
.frame .box::after{content:"";position:absolute;left:50%;transform:translateX(-50%);width:min(64vw,280px);height:3px;background:#f2a3b1;border-radius:3px;animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{0%,100%{margin-top:-130px}50%{margin-top:130px}}
.scan-result{border-radius:16px;padding:18px;text-align:center;margin-top:12px;border:2px solid var(--line);background:#fff;box-shadow:var(--sh-sm)}
.scan-result.ok{border-color:var(--ok);background:var(--ok-soft)}
.scan-result.dup{border-color:var(--warn);background:var(--warn-soft)}
.scan-result.bad{border-color:var(--bad);background:var(--bad-soft)}
.scan-result h2{margin:0 0 4px;font-size:22px}
.list-mode .qr-only{display:none!important}
.scan-list{display:flex;flex-direction:column;gap:8px;max-height:380px;overflow:auto;margin-top:10px}
.scan-item{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.scan-item b{flex:1}
.pass{max-width:480px;margin:10px auto;background:#fff;border-radius:26px;overflow:hidden;box-shadow:0 24px 60px rgba(43,26,20,.22);border:1px solid #e9c9d2}
.pass-top{background:linear-gradient(135deg,#241612,#4a3226 65%,#6b4a35);color:#fff;padding:26px 24px 20px;border-bottom:3px solid #d9a7b2}
.pass-top .ev{font-size:12px;letter-spacing:2px;font-weight:700;color:#f4c2cd}
.pass-top h1{margin:6px 0;font-size:24px;letter-spacing:-.5px}
.pass-top .dt{opacity:.9;font-size:14px}
.pass-body{padding:22px;text-align:center}
.pass-body .who{font-size:20px;font-weight:800}
.pass-body .cat{color:var(--muted);font-size:13px;margin:2px 0 12px}
.pass-qr{background:#fdf8f4;border:1px solid #ecd9d3;border-radius:18px;padding:16px;display:inline-block;box-shadow:inset 0 1px 3px rgba(58,42,36,.06)}
.pass-code{margin:12px 0 4px}
.pass-note{font-size:12.5px;color:var(--muted);margin-top:10px}
.pass-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.footer{text-align:center;color:var(--muted);font-size:12.5px;padding:26px 10px 10px;letter-spacing:.2px}
.kbd{background:#f9edea;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-size:12px;font-family:ui-monospace,monospace}
#print-root{display:none}
@media print{
  body{background:#fff}
  .topbar,.wrap,.fab,#toast-root,#modal-root,.footer,.no-print{display:none!important}
  #print-root{display:block!important;color:#000}
  #print-root h2{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;margin:0 0 8px}
  .sheet{display:grid;gap:8px}
  .sheet.c3{grid-template-columns:1fr 1fr 1fr}
  .sheet.c2{grid-template-columns:1fr 1fr}
  .badge{border:1px solid #333;border-radius:8px;padding:6px;text-align:center;break-inside:avoid;page-break-inside:avoid}
  .badge .pq{display:flex;justify-content:center}
  .badge h4{margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge .e{color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badge .mesa{font-weight:800}
  .badge .c{font-family:ui-monospace,Menlo,Consolas,monospace}
  .badge.sm h4{font-size:11px}
  .badge.sm .e{font-size:8px;margin:1px 0 3px}
  .badge.sm canvas,.badge.sm img{width:92px;height:92px}
  .badge.sm .mesa{font-size:14px;margin-top:2px}
  .badge.sm .c{font-size:9px}
  .badge.md h4{font-size:14px}
  .badge.md .e{font-size:10px;margin:1px 0 4px}
  .badge.md canvas,.badge.md img{width:135px;height:135px}
  .badge.md .mesa{font-size:17px;margin-top:3px}
  .badge.md .c{font-size:11px}
  .badge.lg h4{font-size:17px}
  .badge.lg .e{font-size:12px;margin:2px 0 5px}
  .badge.lg canvas,.badge.lg img{width:175px;height:175px}
  .badge.lg .mesa{font-size:21px;margin-top:3px}
  .badge.lg .c{font-size:13px}
}
/* ===== Refinamento: dentro do evento ===== */
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;color:var(--muted);margin:2px 0 10px}
.back:hover{color:var(--pri)}
.ev-head{background:none;border:none;box-shadow:none;padding:6px 2px 18px;border-bottom:1px solid var(--line);border-radius:0;position:relative;display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.ev-head::after{content:"";position:absolute;left:0;bottom:-1px;width:72px;height:2px;background:var(--gold);border-radius:2px}
.ev-head h1{margin:0;font-size:clamp(26px,4.5vw,34px);letter-spacing:-.6px}
.ev-head .meta{color:var(--muted);font-size:13.5px;margin-top:8px;letter-spacing:.2px}
.ev-head .meta+.meta{margin-top:4px;font-style:italic}
.ev-head>div:last-child{margin-left:auto;align-self:center}
.metrics{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);margin:16px 0;padding:6px 0}
.metrics .stat{border:none;box-shadow:none;border-radius:0;flex:1;min-width:0;text-align:center;padding:12px 10px;background:none}
.metrics .stat::before{display:none}
.metrics .stat+.stat{border-left:1px solid var(--line)}
.metrics .stat b{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:30px;letter-spacing:-.5px}
.metrics .stat span{font-size:11px;text-transform:uppercase;letter-spacing:1.2px}
.btn-quiet{background:transparent;border-color:transparent;color:var(--ink);box-shadow:none;font-weight:600}
.btn-quiet:hover{background:var(--pri-soft);color:var(--pri);box-shadow:none;transform:none}
.actbar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--sh-sm)}
.searchbar input[type=search]{border-radius:99px;background:#fffdfb;padding:12px 18px}
.searchbar input[type=search]:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px #f6dbe1}
.tbl{border-collapse:separate;border-spacing:0}
.tbl th{background:none;font-size:11px;letter-spacing:1.2px;padding:14px 12px 10px}
.tbl td{padding:13px 12px}
.tbl .nm{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:15.5px;letter-spacing:0}
.tbl .sub{font-size:12px}
.tbl tbody tr:hover{background:#fdf9f7}
.tbl .chip{background:none;border:none;padding:4px 0;font-size:13px}
.tbl .chip.ok{color:var(--ok)}
.tbl .chip:not(.ok){color:var(--warn)}
.tbl .code{background:#faf5f2;border:1px solid var(--line);font-weight:600;color:var(--cocoa)}
.tbl .mini{border-color:transparent;color:var(--muted);font-weight:600}
.tbl .mini:hover{color:var(--pri);border-color:var(--pri-soft);background:var(--pri-soft)}

/* ===== Mobile / PWA (iPhone e Android) ===== */
body{touch-action:pan-y;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.topbar{padding-top:env(safe-area-inset-top)}
#toast-root{bottom:calc(20px + env(safe-area-inset-bottom))}
.pwa-tip{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(135deg,#fff,#fdf3f5);border:1px solid #f0d4dc;border-radius:16px;padding:14px 16px;margin:0 0 14px;box-shadow:var(--sh-sm);font-size:14px}
.pwa-tip b{display:block;margin-bottom:2px}
.pwa-tip .hint{margin:2px 0 0}
.pwa-tip .x{flex:none}
@media(max-width:640px){
  .wrap{padding:14px 12px 80px}
  .hero{padding:24px 18px}
  .hero .row .btn{flex:1;justify-content:center;font-size:14px;padding:12px 14px}
  .topbar-in{padding:10px 12px;gap:8px}
  .brand{font-size:16px}
  .brand small{display:none}
  .logo{width:36px;height:36px}
  .topnav{gap:6px;margin-left:auto}
  .topnav .btn{padding:8px 10px;font-size:12.5px}
  .btn{min-height:44px}
  input,select,textarea{font-size:16px!important}
  .stat-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .stat{min-width:0;padding:12px}
  .stat b{font-size:20px}
  .ev-head{padding:16px}
  .toolbar .seg{flex:1}
  .toolbar .seg button{flex:1;padding:9px 6px;font-size:13px;white-space:nowrap}
  table.tbl{min-width:0}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{border-bottom:3px solid var(--line);padding:10px 2px}
  .tbl tr:last-child{border-bottom:none}
  .tbl td{border:none;padding:3px 12px}
  .modal-bg{padding:0;align-items:flex-end}
  .modal{border-radius:22px 22px 0 0;max-height:94vh;max-width:100%;width:100%}
  .modal.wide{max-width:100%}
  .ev-actions .btn{flex:1;justify-content:center}
  #passqr canvas,#passqr img{width:min(72vw,260px)!important;height:auto!important}
  .qr-box canvas,.qr-box img{width:min(70vw,260px)!important;height:auto!important}
  .scan-result h2{font-size:19px}
  .hero{text-align:center;padding:22px 16px}
  .hero h1{font-size:22px}
  .hero p{font-size:13.5px;margin-left:auto;margin-right:auto}
  .hero img{height:100px!important}
  .hero .row{justify-content:center}
  .sec-head h2{font-size:19px;flex:1 1 100%}
  .sec-head select{flex:1;font-size:14px;padding:10px;max-width:100%}
  .scan-stats{grid-template-columns:1fr 1fr 1fr!important;gap:6px}
  .scan-stats .stat{padding:10px 8px;text-align:center}
  .scan-stats .stat b{font-size:17px}
  .scan-stats .stat span{font-size:11px}
  .scan-stats .stat b span{font-size:12px!important}
  .cam{min-height:0}
  .cam video{max-height:300px}
  .cam>div{padding:22px 12px!important;font-size:14px}
  .cambtns{display:grid!important;grid-template-columns:1fr 1fr}
  .cambtns .btn{justify-content:center;font-size:14px;padding:12px 10px}
  .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .toolbar input[type=search]{grid-column:1/-1;min-width:0}
  .toolbar .seg{grid-column:1/-1}
  .toolbar .btn{justify-content:center;font-size:13.5px}
  .modal-f .btn{flex:1;justify-content:center}
  .metrics{gap:0;padding:4px 0}
  .metrics .stat{padding:10px 6px}
  .metrics .stat+.stat{border-left:none}
  .metrics .stat:nth-child(even){border-left:1px solid var(--line)}
  .metrics .stat b{font-size:24px}
  .actbar{padding:10px}
  .actbar .btn-pri{grid-column:1/-1}
  .ev-head{padding:4px 2px 14px}
  .ev-head>div:last-child{margin-left:0;width:100%}
  .ev-head>div:last-child .btn{flex:1;justify-content:center}
  .sec-head{flex-wrap:wrap}
  .sec-head .sp{display:none}
  .sec-head .btn{flex:1;justify-content:center;font-size:13px}
  .scan-head{gap:8px;margin:0 0 10px;padding-bottom:10px}
  .scan-head h2{font-size:17px}
  .scard{display:flex;flex-direction:column}
  .scard>b{order:-2}
  .scard #ssearch{order:-1;margin-bottom:8px;max-height:210px}
}
@media(display-mode:standalone){
  .wrap{padding-top:calc(14px + env(safe-area-inset-top))}
}
</style>

<script>/* ===== CheckIn QR — núcleo ===== */
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const LSKEY='checkinqr_v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad2=n=>String(n).padStart(2,'0');
function fmtDate(d){if(!d)return'—';const[y,m,dd]=String(d).split('-');return dd&&m&&y?`${dd}/${m}/${y}`:d}
function fmtTime(t){return t||''}
function fmtDT(ts){if(!ts)return'—';const d=new Date(ts);return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`}
function genCode(exist){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c;do{c='';for(let i=0;i<6;i++)c+=A[Math.floor(Math.random()*A.length)]}while(exist&&exist.has(c));return c}
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)}return (h>>>0).toString(36)}
function attHash(evt,code){return fnv(evt.secret+'|'+evt.id+'|'+code).slice(0,6)}
function b64e(s){const b=new TextEncoder().encode(s);let t='';for(let i=0;i<b.length;i++)t+=String.fromCharCode(b[i]);return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=String(s||'').replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const t=atob(s);const b=new Uint8Array(t.length);for(let i=0;i<t.length;i++)b[i]=t.charCodeAt(i);return new TextDecoder().decode(b)}
/* ---- QR payload ---- */
function qrPayload(evt,att){
  const t=encodeURIComponent(String(att.table||'').replace(/\./g,'')).slice(0,24);
  return 'CHKIN2.'+evt.id+'.'+att.code+'.'+attHash(evt,att.code)+'.'+t+'.'+encodeURIComponent(att.name||'').slice(0,70);
}
function parsePayload(txt){
  txt=String(txt||'').trim();
  if(/^[A-Za-z0-9]{6}$/.test(txt))return{type:'code',code:txt.toUpperCase()};
  let m=txt.match(/^CHKIN2\.([^\.]+)\.([A-Za-z0-9]{4,10})\.([a-z0-9]{4,8})\.([^\.]*)\.(.*)$/);
  if(m){let nm='',tb='';try{tb=decodeURIComponent(m[4]||'')}catch(e){}try{nm=decodeURIComponent(m[5]||'')}catch(e){}return{type:'qr',v:2,eventId:m[1],code:m[2].toUpperCase(),hash:m[3],table:tb,name:nm}}
  m=txt.match(/^CHKIN1\.([^\.]+)\.([A-Za-z0-9]{4,10})\.([a-z0-9]{4,8})(?:\.(.*))?$/);
  if(m){let nm='';try{nm=m[4]?decodeURIComponent(m[4]):''}catch(e){}return{type:'qr',v:1,eventId:m[1],code:m[2].toUpperCase(),hash:m[3],table:'',name:nm}}
  const h=txt.match(/#\/c\/([A-Za-z0-9\-_]+)/);
  if(h){try{const d=JSON.parse(b64d(h[1]));if(d&&d.a)return{type:'qr',eventId:d.e,code:String(d.a).toUpperCase(),hash:d.h,name:d.n||'',table:d.t||''}}catch(e){}}
  return{type:'unknown',raw:txt};
}
function inviteData(evt,att){return{v:2,e:evt.id,ev:evt.name,dt:evt.date||'',tm:evt.time||'',lc:evt.location||'',a:att.code,n:att.name,c:att.category||'',t:att.table||'',h:attHash(evt,att.code)}}
function inviteLink(evt,att){return location.href.split('#')[0]+'#/c/'+b64e(JSON.stringify(inviteData(evt,att)))}
/* ---- storage ---- */
let DB={events:[]};
function save(){try{localStorage.setItem(LSKEY,JSON.stringify(DB))}catch(e){toast('Erro ao salvar (armazenamento cheio?)','bad')}try{if(typeof schedulePush==='function')schedulePush()}catch(e){}}
function load(){try{const r=localStorage.getItem(LSKEY);if(r)DB=JSON.parse(r)}catch(e){} if(!DB||!Array.isArray(DB.events))DB={events:[]};if(!DB.deletedEvents)DB.deletedEvents={};if(!DB.deletedAtts)DB.deletedAtts={}}
function getEvent(id){return DB.events.find(e=>e.id===id)}
function getAtt(evt,code){return evt.attendees.find(a=>a.code===String(code).toUpperCase())}
function stats(evt){const t=evt.attendees.length,p=evt.attendees.filter(a=>a.status==='present').length;return{total:t,present:p,pending:t-p,pct:t?Math.round(p/t*100):0}}
/* ---- toast & modal ---- */
function toast(msg,kind=''){const r=$('#toast-root');const d=document.createElement('div');d.className='toast '+kind;d.textContent=msg;r.appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transition='.3s';setTimeout(()=>d.remove(),320)},2600)}
function openModal(html,wide){const r=$('#modal-root');r.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal${wide?' wide':''}" role="dialog">${html}</div></div>`}
function closeModal(){$('#modal-root').innerHTML='';if(window._scanStreamCleanup&&window._importCam){try{window._importCam()}catch(e){}}}
function confirmDlg(title,msg,okLabel,fn){window._cfFn=fn;openModal(`<div class="modal-h"><h3>${esc(title)}</h3><button class="x" onclick="closeModal()">✕</button></div><div class="modal-b"><p style="margin:0 0 6px">${msg}</p></div><div class="modal-f"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-pri" onclick="window._cfFn();closeModal()">${esc(okLabel||'Confirmar')}</button></div>`)}
function beep(ok=true){try{const C=window.AudioContext||window.webkitAudioContext;const ctx=new C();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.value=ok?880:220;g.gain.value=.18;o.start();setTimeout(()=>{o.stop();ctx.close()},ok?180:350)}catch(e){}}
/* ---- QR render ---- */
function drawQR(el,text,size){el.innerHTML='';try{new QRCode(el,{text:text,width:size||220,height:size||220,correctLevel:QRCode.CorrectLevel.M})}catch(e){el.innerHTML='<p style="color:#c00">Erro ao gerar QR</p>'}}
function qrCanvasOf(text,size){const tmp=document.createElement('div');tmp.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(tmp);drawQR(tmp,text,size||512);let url=null;const cv=tmp.querySelector('canvas');if(cv)url=cv.toDataURL('image/png');else{const im=tmp.querySelector('img');if(im)url=im.src}tmp.remove();return url}
function download(url,filename){const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove()}
/* ================= ROUTER ================= */
const app=()=> $('#app');
function route(){
  stopScanner();
  const h=location.hash||'#/';
  const invite=h.match(/^#\/c\/([A-Za-z0-9\-_]+)/);
  if(invite)return viewInvite(invite[1]);
  const sc=h.match(/^#\/checkin\/([^\/]+)/);

function eventCards(){
  if(!DB.events.length)return `<div class="card empty"><div class="big">🎉</div><b>Nenhum evento ainda</b><p>Clique em <b>Novo evento</b> para começar.</p><button class="btn btn-pri" onclick="dlgEvent()">＋ Criar meu primeiro evento</button><p style="margin-top:10px"><button class="btn btn-sm btn-ghost" onclick="seedDemo()">ou carregar evento de exemplo</button></p></div>`;
  return `<div class="ev-grid">`+DB.events.map(e=>{
    const s=stats(e);
    return `<div class="card ev-card">
      <h3>${esc(e.name)}</h3>
      <div class="ev-meta"><span>📅 ${fmtDate(e.date)} ${fmtTime(e.time)?'• '+esc(e.time):''}</span><span>📍 ${esc(e.location||'Local a definir')}</span></div>
      <div class="ev-bar"><i style="width:${s.pct}%"></i></div>
      <div class="ev-stats"><span class="chip">👥 ${s.total}</span><span class="chip ok">✓ ${s.present} presentes</span><span class="chip warn">◷ ${s.pending} pendentes</span></div>
      <div class="ev-actions">
        <a class="btn btn-sm btn-pri" href="#/evento/${e.id}">Abrir</a>
        <a class="btn btn-sm" href="#/checkin/${e.id}">📷 Portaria</a>
        <button class="btn btn-sm" onclick="dlgEvent('${e.id}')">✏️</button>
        <button class="btn btn-sm btn-bad" onclick="delEvent('${e.id}')">🗑</button>
      </div>
    </div>`}).join('')+`</div>`;
}
/* ---- evento: criar/editar/excluir ---- */
function dlgEvent(id){
  const e=id?getEvent(id):null;
  openModal(`<div class="modal-h"><h3>${e?'Editar evento':'Novo evento'}</h3><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-b">
    <div class="field"><label>Nome do evento *</label><input id="f-name" value="${esc(e?.name||'')}" placeholder="Ex: Festa de 15 anos da Ana, Culto de Jovens, Formatura..."></div>
    <div class="f2">
      <div class="field"><label>Data</label><input id="f-date" type="date" value="${esc(e?.date||'')}"></div>
      <div class="field"><label>Hora</label><input id="f-time" type="time" value="${esc(e?.time||'')}"></div>
    </div>
    <div class="field"><label>Local</label><input id="f-loc" value="${esc(e?.location||'')}" placeholder="Ex: Ginásio Central — Igarapé-Açu/PA"></div>
    <div class="field"><label>Descrição / recado do convite</label><textarea id="f-desc" rows="2" placeholder="Ex: Apresente o QR Code na entrada. Proibida a entrada após 21h.">${esc(e?.description||'')}</textarea></div>
  </div>
  <div class="modal-f"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-pri" onclick="saveEvent('${id||''}')">Salvar evento</button></div>`);
  setTimeout(()=>$('#f-name')?.focus(),80);
}
function saveEvent(id){
  const name=$('#f-name').value.trim();
  if(!name)return toast('Dê um nome ao evento','bad');
  if(id){const e=getEvent(id);Object.assign(e,{name,date:$('#f-date').value,time:$('#f-time').value,location:$('#f-loc').value.trim(),description:$('#f-desc').value.trim()});save();closeModal();toast('Evento atualizado','ok');route()}
  else{const e={id:uid('evt'),name,date:$('#f-date').value,time:$('#f-time').value,location:$('#f-loc').value.trim(),description:$('#f-desc').value.trim(),secret:genCode(new Set()),createdAt:Date.now(),attendees:[]};DB.events.unshift(e);save();closeModal();toast('Evento criado! Agora importe a lista 🎉','ok');location.hash='#/evento/'+e.id}
}
function delEvent(id){const e=getEvent(id);confirmDlg('Excluir evento',`Excluir <b>${esc(e.name)}</b> e todos os ${e.attendees.length} convidados? Essa ação não pode ser desfeita.`,'Excluir',()=>{DB.deletedEvents[id]=Date.now();Object.keys(DB.deletedAtts).forEach(k=>{if(k.indexOf(id+':')===0)delete DB.deletedAtts[k]});DB.events=DB.events.filter(x=>x.id!==id);save();toast('Evento excluído');if((location.hash||'').includes(id))location.hash='#/';else route()})}
/* ================= EVENTO ================= */
let EV=null,FILTER='all',QUERY='';
function viewEvent(id){
  EV=getEvent(id);
  if(!EV){app().innerHTML=`<div class="card empty"><div class="big">😕</div><b>Evento não encontrado</b><p><a href="#/">Voltar ao início</a></p></div>`;return}
  FILTER='all';QUERY='';
  renderEvent();
}
function renderEvent(){
  const e=EV,s=stats(e);
  app().innerHTML=`
  <a class="back" href="#/">← Eventos</a>
  <div class="ev-head">
    <div style="flex:1;min-width:240px">
      <h1>${esc(e.name)}</h1>
      <div class="meta">${fmtDate(e.date)}${fmtTime(e.time)?' • '+esc(e.time):''} • ${esc(e.location||'Local a definir')}</div>
      ${e.description?`<div class="meta">${esc(e.description)}</div>`:''}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn btn-pri" href="#/checkin/${e.id}">Abrir portaria →</a>
      <button class="btn btn-quiet" onclick="dlgEvent('${e.id}')">Editar</button>
    </div>
  </div>
  <div class="stat-row metrics">
    <div class="stat"><b>${s.total}</b><span>convidados</span></div>
    <div class="stat"><b style="color:var(--ok)">${s.present}</b><span>presentes</span></div>
    <div class="stat"><b style="color:var(--warn)">${s.pending}</b><span>pendentes</span></div>
    <div class="stat"><b>${s.pct}%</b><span>comparecimento</span></div>
  </div>
  <div class="toolbar actbar no-print">
    <button class="btn btn-pri" onclick="dlgImport()">📥 Importar lista</button>
    <button class="btn" onclick="dlgAtt()">＋ Adicionar</button>
    <button class="btn btn-quiet" onclick="dlgPrint()">🖨️ Imprimir QRs</button>
    <button class="btn btn-quiet" onclick="exportCSV()">⬇ Exportar CSV</button>
    <button class="btn btn-quiet" onclick="fixAccents()" title="Corrige nomes importados com erro de acentuação">🔤 Acentos</button>
    <button class="btn btn-ghost" onclick="resetCheckin()">↺ Zerar presenças</button>
  </div>
  <div class="toolbar searchbar no-print">
    <input type="search" id="q" placeholder="Buscar por nome, código ou mesa…" value="${esc(QUERY)}" oninput="QUERY=this.value;renderAttRows()">
    <div class="seg">
      <button class="${FILTER==='all'?'on':''}" onclick="FILTER='all';renderEvent()">Todos</button>
      <button class="${FILTER==='pending'?'on':''}" onclick="FILTER='pending';renderEvent()">Pendentes</button>
      <button class="${FILTER==='present'?'on':''}" onclick="FILTER='present';renderEvent()">Presentes</button>
    </div>
  </div>
  <div class="card tbl-wrap"><table class="tbl"><thead><tr><th>Convidado</th><th>Código</th><th>🪑 Mesa</th><th>Status</th><th>Check-in</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="footer">Toque em <b>QR</b> para enviar o convite pelo WhatsApp · Na festa, use a <b>Portaria</b> para ler os QRs</div>`;
  renderAttRows();
}
function filteredAtt(){
  const q=norm(QUERY.trim());

function smartFixWord(w){
  w=String(w||'');
  if(w.indexOf('\ufffd')<0)return w;
  if(!NOMES_SET)NOMES_SET=new Set(NOMES_BR.map(n=>String(n).toLowerCase()));
  const marks='áàâãäéèêëíìîïóòôõöúùûüýÿçñ'.split('');
  const pos=[];for(let i=0;i<w.length;i++)if(w[i]==='\ufffd')pos.push(i);
  if(!pos.length||pos.length>2)return w;
  const up=w===w.toUpperCase()&&w!==w.toLowerCase();
  const arr=w.split(''),found={};
  const rec=k=>{if(k===pos.length){const c=arr.join('').toLowerCase();if(NOMES_SET.has(c))found[c]=1;return}for(const m of marks){arr[pos[k]]=m;rec(k+1)}};
  rec(0);
  const keys=Object.keys(found);
  if(!keys.length)return w;
  let pick=keys[0];
  if(keys.length>1){
    if(!NOMES_COMUM)NOMES_COMUM=new Set('márcia,márcio,josé,joão,luís,luísa,júnior,júlio,césar,andré,fábio,fátima,patrícia,débora,érica,flávia,flávio,sérgio,lúcia,mônica,rogério,rogéria,letícia,vinícius,túlio,marília,otávio,otília,antônio,antônia,júlia,tânia,mário,rômulo,romário,gláucia,gláucio,kátia,sônia,nádia,natália,cíntia,cláudia,cláudio,fabrício,maurício,cecília,heloísa,cássia,cássio,tomás,inês,laís,taís,raíssa'.split(','));
    const freq=keys.filter(k=>NOMES_COMUM.has(k));
    if(freq.length!==1)return w;
    pick=freq[0];SMART_GUESSED.push(pick);
  }
  const r=pick;
  return up?r.toUpperCase():(r.charAt(0).toUpperCase()+r.slice(1));
}

<script>/* ===== CheckIn QR — importação, QR, scanner, convite ===== */

let IMP={rows:[],cols:[],map:{},hasHeader:true};
function dlgImport(){
  IMP={rows:[],cols:[],map:{},hasHeader:true};
  openModal(`<div class="modal-h"><h3>📥 Importar lista de convidados</h3><button class="x" onclick="closeModal()">✕</button></div>

    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-sm" onclick="parsePaste()">Ler texto colado</button>
    <label class="hint" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="hasH" checked onchange="IMP.hasHeader=this.checked;renderMap()"> primeira linha é cabeçalho</label></div>

function dropCSV(ev){ev.preventDefault();$('#drop').classList.remove('over');const f=ev.dataTransfer.files[0];if(f)readFile(f)}
function fileCSV(inp){if(inp.files[0])readFile(inp.files[0]);inp.value=''}
function readFile(f){const r=new FileReader();r.onload=()=>{let t='';try{t=new TextDecoder('utf-8',{fatal:true}).decode(r.result)}catch(e){try{t=new TextDecoder('windows-1252').decode(r.result)}catch(e2){t=''}}parseCSVText(t)};r.readAsArrayBuffer(f)}
function parsePaste(){const t=$('#paste').value;if(!t.trim())return toast('Cole a lista primeiro','bad');parseCSVText(t)}
function detectDelim(line){const c=[';','\t',',','|'];let best=';',n=-1;for(const d of c){const k=line.split(d).length;if(k>n){n=k;best=d}}return best}
function parseCSVText(text){
  text=String(text||'').replace(/^\uFEFF/,'').trim();
  if(!text)return toast('Arquivo vazio','bad');
  const lines=text.split(/\r?\n/).filter(l=>l.trim()!=='');
  const delim=detectDelim(lines[0]);
  const rows=lines.map(l=>{
    const out=[];let cur='',q=false;
    for(let i=0;i<l.length;i++){const ch=l[i];
      if(ch==='"'){if(q&&l[i+1]==='"'){cur+='"';i++}else q=!q}
      else if(ch===delim&&!q){out.push(cur.trim());cur=''}
      else cur+=ch}
    out.push(cur.trim());return out.map(c=>c.replace(/^"|"$/g,'').trim());
  });
  const ncols=Math.max(...rows.map(r=>r.length));
  IMP.rows=rows;IMP.cols=Array.from({length:ncols},(_,i)=>'col'+i);
  IMP.hasHeader=$('#hasH')?$('#hasH').checked:true;
  autoMap();renderMap();
}
function autoMap(){
  const head=IMP.hasHeader?IMP.rows[0]:[];
  const guess=i=>{
    const h=(head[i]||'').toLowerCase();
    if(/nom/.test(h))return'name';if(/mail|e-mail/.test(h))return'email';
    if(/tel|fone|whats|cel/.test(h))return'phone';if(/mesa/.test(h))return'table';if(/categ|lote|tipo|setor|grupo/.test(h))return'category';
    if(/obs|nota|mesa|acompanha/.test(h))return'notes';
    if(i===0)return'name';if(i===1)return'phone';if(i===2)return'email';return'ignore';
  };

}
function renderMap(){
  const z=$('#mapzone');if(!z)return;
  if(!IMP.rows.length){z.innerHTML='';return}

  const data=IMP.rows.slice(start).filter(r=>r.some(c=>c!==''));
  const fields=[['ignore','— Ignorar —'],['name','👤 Nome'],['phone','📱 WhatsApp/Telefone'],['email','✉️ E-mail'],['category','🎟️ Categoria/Lote'],['table','🪑 Mesa'],['notes','📝 Observações']];

  <div class="prev-tbl"><table><thead><tr>${IMP.cols.map((_,i)=>`<th>${esc($('#hasH')&&IMP.hasHeader?(IMP.rows[0][i]||''):('Col '+(i+1)))}</th>`).join('')}</tr></thead>
  <tbody>${data.slice(0,8).map(r=>`<tr>${IMP.cols.map((_,i)=>`<td>${esc(r[i]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  ${data.length>8?`<div class="hint">...e mais ${data.length-8} linhas</div>`:''}
  <label class="hint" style="display:flex;align-items:center;gap:6px;margin-top:8px"><input type="checkbox" id="dedup" checked> ignorar duplicados (mesmo nome + telefone)</label>`;
  const ok=Object.values(IMP.map).includes('name');

  if(!ok)$('#btnImp').textContent='Mapeie uma coluna como 👤 Nome';
}
function doImport(){
  const start=IMP.hasHeader?1:0;
  const data=IMP.rows.slice(start).filter(r=>r.some(c=>c!==''));
  const dedup=$('#dedup')?.checked;
  const seen=new Set(EV.attendees.map(a=>(a.name+'|'+(a.phone||'')).toLowerCase()));
  const ex=new Set(EV.attendees.map(a=>a.code));
  let n=0,skip=0;

    ex.add(EV.attendees[EV.attendees.length-1].code);n++;

}
/* ================= QR / CONVITE / COMPARTILHAR ================= */
function dlgQR(code){

function copyLink(){const i=$('#invlink');i.select();i.setSelectionRange(0,99999);try{navigator.clipboard.writeText(i.value)}catch(e){document.execCommand('copy')}toast('Link copiado!','ok')}
function dlQR(code){
  const a=getAtt(EV,code);if(!a)return;
  const url=qrCanvasOf(qrPayload(EV,a),512);
  if(url){download(url,`QR-${EV.name.replace(/\W+/g,'-')}-${a.name.replace(/\W+/g,'-')}-${a.code}.png`);toast('QR baixado!','ok')}
  else toast('Falha ao gerar imagem','bad');
}

function printPass(){
  const d=window._passData||{};
  const root=$('#print-root');
  root.innerHTML=`<div class="sheet c2"><div class="badge md"><h4>${esc(d.n||'Convidado')}</h4><div class="e">${esc(d.ev||'Evento')} • ${fmtDate(d.dt)} ${esc(d.tm||'')}</div><div class="pq" id="ppqr"></div>${d.t?`<div class="mesa">🪑 MESA ${esc(d.t)}</div>`:''}<div class="c">${esc(String(d.a||'').toUpperCase())}</div></div></div>`;

  setTimeout(()=>window.print(),350);
}

let SC={eventId:null,stream:null,raf:0,detector:null,last:'',lastAt:0,recent:[],running:false};
function setScanMode(m){SC.mode=m;try{localStorage.setItem('lu_scanmode',m)}catch(e){}stopScanner();renderScanner()}
function stopScanner(){
  SC.running=false;
  if(SC.raf)cancelAnimationFrame(SC.raf);SC.raf=0;
  if(SC.stream){SC.stream.getTracks().forEach(t=>t.stop());SC.stream=null}
}
function viewScanner(eventId){
  if(eventId&&!getEvent(eventId))eventId=null;
  SC.eventId=eventId||DB.events[0]?.id||null;SC.recent=[];SC.last='';SC.lastAt=0;try{SC.mode=localStorage.getItem('lu_scanmode')||'qr'}catch(e){SC.mode='qr'}
  renderScanner();
}

async function toggleCam(){
  if(SC.stream){stopScanner();renderScanner();return}
  const cam=$('#cam');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    SC.stream=stream;SC.running=true;
    cam.innerHTML=`<video id="v" playsinline muted autoplay></video><div class="frame"><div class="box"></div></div>`;
    const v=$('#v');v.srcObject=stream;await v.play();
    $('#btnCam').textContent='⏹ Desligar câmera';
    if('BarcodeDetector' in window){try{SC.detector=new BarcodeDetector({formats:['qr_code']})}catch(e){SC.detector=null}}
    scanLoop();
  }catch(e){cam.innerHTML=`<div style="text-align:center;padding:30px">🚫<br><b>Sem acesso à câmera</b><br><span class="hint" style="color:#aab">${esc(e.message||e)}<br>Use a digitação manual ou leitura de imagem.</span></div>`;toast('Permita o uso da câmera','bad')}
}
function scanLoop(){
  if(!SC.running)return;
  const v=$('#v');
  const tick=async()=>{
    if(!SC.running||!v||v.readyState!==4){SC.raf=requestAnimationFrame(tick);return}
    try{
      let text=null;
      if(SC.detector){const ds=await SC.detector.detect(v);if(ds&&ds.length)text=ds[0].rawValue}
      else if(window.jsQR){
        const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
        const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0);
        const d=x.getImageData(0,0,c.width,c.height);const r=jsQR(d.data,d.width,d.height);
        if(r)text=r.data;
      }
      if(text){const now=Date.now();if(text!==SC.last||now-SC.lastAt>3000){SC.last=text;SC.lastAt=now;onScan(text)}}
    }catch(e){}
    await new Promise(r=>setTimeout(r,220));
    SC.raf=requestAnimationFrame(tick);
  };
  tick();
}
function scanImage(inp){
  const f=inp.files[0];if(!f)return;
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
    const x=c.getContext('2d');x.drawImage(img,0,0);
    try{const d=x.getImageData(0,0,c.width,c.height);const r=jsQR(d.data,d.width,d.height);
      if(r&&r.data)onScan(r.data);else toast('Nenhum QR encontrado na imagem','bad');
    }catch(e){toast('Falha ao ler imagem','bad')}
    URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(f);inp.value='';
}
function manualScan(){const v=$('#mcode').value.trim().toUpperCase();if(!v)return;onScan(v);$('#mcode').value='';$('#mcode').focus()}
function onScan(text){
  const ev=getEvent(SC.eventId);if(!ev){toast('Este evento não existe mais — volte e escolha outro','bad');return}
  const p=parsePayload(text);
  const box=$('#sres');
  if(p.type==='code'||p.type==='qr'){
    if(p.type==='qr'&&p.eventId!==ev.id){beep(false);if(navigator.vibrate)navigator.vibrate(200);
      box.innerHTML=`<div class="scan-result bad"><h2>⛔ QR de outro evento</h2><p>Este QR é de outro evento. Selecione o evento correto acima.</p><p class="code">${esc(p.code||'')}</p></div>`;return}
    const a=getAtt(ev,p.code);
    if(!a){beep(false);if(navigator.vibrate)navigator.vibrate(200);
      box.innerHTML=`<div class="scan-result bad"><h2>❌ Código não encontrado</h2><p>Nenhum convidado com código <b>${esc(p.code||text)}</b> neste evento.</p></div>`;return}
    if(p.type==='qr'&&p.hash&&p.hash!==attHash(ev,a.code)){beep(false);
      box.innerHTML=`<div class="scan-result bad"><h2>⚠️ QR inválido</h2><p>O código de segurança não confere. Confira com a organização.</p></div>`;return}
    if(a.status==='present'){beep(false);
      const mesa2=a.table||p.table||'';
      box.innerHTML=`<div class="scan-result dup"><h2>⚠️ Já entrou!</h2><p><b style="font-size:20px">${esc(a.name)}</b><br>${esc(a.category||'')} • ${esc(a.code)}</p>${mesa2?`<div style="font-size:30px;font-weight:800;margin:4px 0">🪑 Mesa ${esc(mesa2)}</div>`:''}<p>Entrada registrada às ${fmtDT(a.checkedInAt)}</p></div>`;
      pushRecent(`⚠️ ${a.name} — duplicado`);renderRecent();return}
    a.status='present';a.checkedInAt=Date.now();save();beep(true);if(navigator.vibrate)navigator.vibrate(80);
    const mesa=a.table||p.table||'';
    box.innerHTML=`<div class="scan-result ok"><h2>✅ Bem-vindo(a)!</h2><p><b style="font-size:24px">${esc(a.name)}</b><br>${esc(a.category||'Convidado')} • <span class="code">${esc(a.code)}</span></p>${mesa?`<div style="font-size:34px;font-weight:800;margin:4px 0">🪑 Mesa ${esc(mesa)}</div>`:`<div class="hint">sem mesa definida</div>`}<p>Entrada: ${fmtDT(a.checkedInAt)}</p></div>`;
    pushRecent(`✅ ${a.name}${mesa?' — Mesa '+mesa:''}`);renderRecent();
    const s=stats(ev);const st=$$('.stat-row .stat b')[0];if(st)st.innerHTML=`${s.present}<span style="color:var(--muted);font-size:15px">/${s.total}</span>`;
    const st2=$$('.stat-row .stat b')[1];if(st2)st2.textContent=s.pct+'%';
    return;
  }
  beep(false);box.innerHTML=`<div class="scan-result bad"><h2>❓ QR não reconhecido</h2><p>Conteúdo: <span class="code">${esc(String(text).slice(0,80))}</span></p></div>`;
}
function pushRecent(t){SC.recent.unshift({t,at:Date.now()});SC.recent=SC.recent.slice(0,30)}
function renderRecent(){const l=$('#slist');if(!l)return;l.innerHTML=SC.recent.length?SC.recent.map(r=>`<div class="scan-item"><b>${esc(r.t)}</b><span class="hint">${fmtDT(r.at)}</span></div>`).join(''):'<div class="hint">Nenhuma leitura ainda.</div>';
  const c3=$$('.stat-row .stat b')[2];if(c3)c3.textContent=SC.recent.length}

function exportCSV(){

  const lines=[head.join(';')].concat(EV.attendees.slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'pt-BR',{sensitivity:'base'})).map(a=>[a.name,a.code,a.phone||'',a.email||'',a.category||'',a.table||'',a.status==='present'?'presente':'pendente',a.checkedInAt?new Date(a.checkedInAt).toLocaleString('pt-BR'):'',a.notes||''].map(csvCell).join(';')));
  download('data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(lines.join('\n')),`lista-${EV.name.replace(/\W+/g,'-')}.csv`);
  toast('CSV exportado!','ok');
}
function exportBackup(){download('data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(DB)),`backup-lucerimonialista-${new Date().toISOString().slice(0,10)}.json`);toast('Backup baixado!','ok')}
function importBackup(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d&&Array.isArray(d.events)){DB=d;save();route();toast(`Backup restaurado: ${d.events.length} evento(s)`,'ok')}else toast('Arquivo inválido','bad')}catch(e){toast('Arquivo inválido','bad')}};
  r.readAsText(f);inp.value='';
}

<script>/* ===== Lu Cerimonialista — Nuvem automática (MQTT) + busca por nome na portaria ===== */
'use strict';
const CLOUD_KEY='checkinqr_cloud';
const CLOUD_TOPIC='lucerimonialista/checkin/v1/k7f2mx9qd4v8we1pz';
const CLOUD_BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
let CLOUD={enabled:true,device:'dev_'+Math.random().toString(36).slice(2,9),lastSync:0,client:null,_pt:0,_seen:{},_retry:0};
function cloudLoad(){try{const c=JSON.parse(localStorage.getItem(CLOUD_KEY)||'null');if(c&&typeof c.enabled==='boolean')CLOUD.enabled=c.enabled;if(c&&c.device)CLOUD.device=c.device;}catch(e){}}
function cloudSaveCfg(){try{localStorage.setItem(CLOUD_KEY,JSON.stringify({enabled:CLOUD.enabled,device:CLOUD.device}))}catch(e){}}
function cloudState(){const c=CLOUD.client;if(c&&c.connected)return'on';return CLOUD.enabled?(navigator.onLine?'try':'off'):'off'}
function cloudDot(){
  const b=$('#cloudbtn');if(!b)return;
  const s=cloudState();
  b.innerHTML=s==='on'?'☁️ On-line':s==='try'?'☁️ Ligando…':'☁️ Off-line';
  b.style.borderColor=s==='on'?'#9fd8a8':'';
  const ago=CLOUD.lastSync?Math.floor((Date.now()-CLOUD.lastSync)/1000):-1;
  b.title=s==='on'?('Nuvem ligada • última sync '+(ago<0?'agora':ago<60?ago+'s atrás':Math.floor(ago/60)+'min atrás')):(CLOUD.enabled?'Conectando à nuvem automática…':'Nuvem desligada — toque para ligar');
}
function cloudConnect(idx){
  idx=idx||0;
  cloudEnd();
  if(!CLOUD.enabled||!navigator.onLine)return;
  if(!window.mqtt)return;
  if(idx>=CLOUD_BROKERS.length){CLOUD._retry=setTimeout(()=>{if(CLOUD.enabled)cloudConnect(0)},15000);cloudDot();return}
  cloudDot();
  try{
    const c=mqtt.connect(CLOUD_BROKERS[idx],{clientId:'lu_'+CLOUD.device+'_'+Math.random().toString(36).slice(2,6),clean:true,connectTimeout:9000,reconnectPeriod:5000});
    CLOUD.client=c;
    const to=setTimeout(()=>{try{c.end(true)}catch(e){}if(CLOUD.client===c){CLOUD.client=null;cloudConnect(idx+1)}},12000);
    c.on('connect',()=>{clearTimeout(to);CLOUD.lastSync=Date.now();
      try{c.subscribe(CLOUD_TOPIC,{qos:1})}catch(e){}
      cloudDot();
      setTimeout(()=>{if(CLOUD.enabled&&c.connected&&DB.events.length)mqttPublish()},2200);
    });
    c.on('message',(t,m)=>{cloudOnMsg(m)});
    c.on('reconnect',cloudDot);c.on('offline',cloudDot);
    c.on('close',()=>{if(CLOUD.client===c)cloudDot()});
    c.on('error',()=>{});
  }catch(e){cloudConnect(idx+1)}
}
function cloudEnd(){clearTimeout(CLOUD._retry);if(CLOUD.client){try{CLOUD.client.end(true)}catch(e){}CLOUD.client=null}}
function cloudOnMsg(m){
  let d=null;try{d=JSON.parse(m.toString())}catch(e){return}
  if(!d||!Array.isArray(d.events)||!d.mid)return;
  if(CLOUD._seen[d.mid])return;
  CLOUD._seen[d.mid]=1;
  if(Object.keys(CLOUD._seen).length>300)CLOUD._seen={};
  if(d.device===CLOUD.device)return;
  if(mergeCloud(d)){save();refreshAfterSync()}
  CLOUD.lastSync=Date.now();cloudDot();
}
function schedulePush(){if(!CLOUD.enabled)return;clearTimeout(CLOUD._pt);CLOUD._pt=setTimeout(()=>mqttPublish(),1500)}
function mqttPublish(){
  if(!CLOUD.enabled)return;
  const c=CLOUD.client;if(!c||!c.connected)return;
  try{
    const mid='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const s=JSON.stringify({mid:mid,device:CLOUD.device,updatedAt:Date.now(),events:DB.events,deletedEvents:DB.deletedEvents||{},deletedAtts:DB.deletedAtts||{}});
    if(s.length>400000){toast('Lista muito grande p/ nuvem — use Backup/Restaurar','bad');return}
    CLOUD._seen[mid]=1;
    c.publish(CLOUD_TOPIC,s,{qos:1,retain:true});
    CLOUD.lastSync=Date.now();cloudDot();
  }catch(e){}
}
function mergeCloud(d){
  const remote=Array.isArray(d.events)?d.events:[];
  const rDelE=(d&&d.deletedEvents)||{}, rDelA=(d&&d.deletedAtts)||{};
  if(!DB.deletedEvents)DB.deletedEvents={}; if(!DB.deletedAtts)DB.deletedAtts={};
  let changed=false;
  const now=Date.now(), MONTH=30*24*3600*1000;
  for(const id in rDelE){if(!DB.deletedEvents[id]){DB.deletedEvents[id]=rDelE[id]||now;changed=true}}
  for(const k in rDelA){if(!DB.deletedAtts[k]){DB.deletedAtts[k]=rDelA[k]||now;changed=true}}
  for(const id in DB.deletedEvents){if(now-DB.deletedEvents[id]>MONTH){delete DB.deletedEvents[id];changed=true}}
  for(const k in DB.deletedAtts){if(now-DB.deletedAtts[k]>MONTH){delete DB.deletedAtts[k];changed=true}}
  const bn=DB.events.length;
  DB.events=DB.events.filter(e=>!DB.deletedEvents[e.id]);
  if(DB.events.length!==bn)changed=true;
  for(const re of remote){
    if(!re||DB.deletedEvents[re.id])continue;
    let le=DB.events.find(e=>e.id===re.id);
    if(!le){const cp=JSON.parse(JSON.stringify(re));cp.attendees=(cp.attendees||[]).filter(a=>!DB.deletedAtts[re.id+':'+a.code]);DB.events.push(cp);changed=true;continue}
    const bl=le.attendees.length;
    le.attendees=le.attendees.filter(a=>!DB.deletedAtts[le.id+':'+a.code]);
    if(le.attendees.length!==bl)changed=true;
    for(const ra of (re.attendees||[])){
      if(DB.deletedAtts[le.id+':'+ra.code])continue;
      let la=le.attendees.find(a=>a.code===ra.code);
      if(!la){le.attendees.push(ra);changed=true;continue}
      if(ra.status==='present'&&la.status!=='present'){la.status='present';la.checkedInAt=ra.checkedInAt||Date.now();changed=true}
      for(const f of ['name','phone','email','category','table','notes']){if(!la[f]&&ra[f]){la[f]=ra[f];changed=true}}
    }
  }
  return changed;
}
function refreshAfterSync(){
  if($('#modal-root')&&$('#modal-root').firstChild)return;
  const h=location.hash||'#/';
  if(h.indexOf('#/evento/')===0&&typeof EV!=='undefined'&&EV){
    if(!getEvent(EV.id)){toast('Este evento foi excluído em outro aparelho');location.hash='#/';return}
    if(document.activeElement&&(document.activeElement.id==='q'))return;
    const q=QUERY,f=FILTER;renderEvent();QUERY=q;FILTER=f;
    const qi=$('#q');if(qi)qi.value=q;renderAttRows();
  }
  else if(h.indexOf('#/checkin')===0){cloudUpdateScanStats();try{if($('#scanq')&&(($('#scanq').value||$('#scanmesa').value)))scanSearch()}catch(e){}}
  else if(h==='#/'||h==='#'||h===''){route()}
}
function cloudUpdateScanStats(){
  try{
    const ev=getEvent(SC.eventId);if(!ev)return;const s=stats(ev);
    const bs=$$('.stat-row .stat b');
    if(bs[0])bs[0].innerHTML=`${s.present}<span style="color:var(--muted);font-size:15px">/${s.total}</span>`;
    if(bs[1])bs[1].textContent=s.pct+'%';
  }catch(e){}
}
function cloudInit(){
  cloudLoad();cloudDot();
  if(CLOUD.enabled){setTimeout(()=>cloudConnect(0),800)}
  window.addEventListener('online',()=>{cloudDot();if(CLOUD.enabled)cloudConnect(0)});
  window.addEventListener('offline',()=>{cloudDot()});
}
/* ---- janela da nuvem (sem configuração!) ---- */
function dlgCloud(){
  const s=cloudState();
  const ago=CLOUD.lastSync?Math.floor((Date.now()-CLOUD.lastSync)/1000):-1;
  openModal(`<div class="modal-h"><h3>☁️ Nuvem automática</h3><button class="x" onclick="closeModal()">✕</button></div>
  <div class="modal-b">
    <p class="hint" style="margin-top:0">Quando há internet, <b>todos os celulares com este app sincronizam sozinhos</b> — sem configurar nada. ✅ A cada entrada confirmada, os outros aparelhos atualizam em segundos.</p>
    <div class="field"><label>Status</label><div>${s==='on'?'<span class="chip ok">☁️ Ligado e sincronizando</span>':s==='try'?'<span class="chip warn">Ligando…</span>':'<span class="chip">Desligado</span>'}</div>
    <div class="hint">Última sincronização: ${ago<0?'ainda não':ago<5?'agora mesmo':ago<60?ago+'s atrás':Math.floor(ago/60)+'min atrás'}</div></div>
    <div class="field"><label class="hint" style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="c-auto" ${CLOUD.enabled?'checked':''} onchange="cloudToggle(this.checked)" style="width:18px;height:18px"> Sincronização automática</label></div>
    <div class="field"><label>Sem internet no local?</label><div class="hint">O app funciona off-line normalmente. Depois, use <b>⬇ Backup</b> (na tela inicial) em um aparelho e <b>⬆ Restaurar</b> no outro para juntar as listas. 💾</div></div>
  </div>
  <div class="modal-f"><button class="btn" onclick="closeModal()">Fechar</button><button class="btn btn-pri" onclick="cloudSyncNow()">☁️ Sincronizar agora</button></div>`);
}
function cloudToggle(v){
  CLOUD.enabled=!!v;cloudSaveCfg();
  if(v){closeModal();cloudConnect(0);toast('Nuvem ligada ☁️')}
  else{cloudEnd();closeModal();cloudDot();toast('Nuvem desligada — só este aparelho')}
}
function cloudSyncNow(){
  closeModal();
  if(!CLOUD.enabled){toast('Ligue a nuvem primeiro','bad');return}
  if(!navigator.onLine){toast('Sem internet no momento — use Backup/Restaurar','bad');return}
  const c=CLOUD.client;
  if(!c||!c.connected){cloudConnect(0);toast('Conectando à nuvem...')}
  else{mqttPublish();toast('Sincronizado! ☁️','ok')}
}
/* ================= BUSCA POR NOME NA PORTARIA ================= */
function buildMesaOptions(){
  const sel=$('#scanmesa');const ev=getEvent(SC.eventId);
  if(!sel||!ev)return '';
  const open=[...new Set(ev.attendees.filter(a=>a.status!=='present').map(a=>String(a.table||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true}));
  const cur=sel.value;
  sel.innerHTML='<option value="">🪑 Mesa...</option>'+open.map(t=>`<option value="${esc(t)}">🪑 Mesa ${esc(t)}</option>`).join('');
  if(cur&&open.some(t=>norm(t)===norm(cur))){sel.value=open.find(t=>norm(t)===norm(cur));return norm(sel.value)}
  if(cur)toast('Mesa '+cur+' completa! 🎉');
  sel.value='';return '';
}
function scanSearch(){
  const box=$('#ssearch');const ev=getEvent(SC.eventId);
  if(!ev||!box)return;
  const q=norm((($('#scanq')||{}).value||'').trim());
  const mq=buildMesaOptions();
  if(!q&&!mq){box.innerHTML='<div class="hint">Digite um nome ou nº de mesa — a lista aparece na hora.</div>';return}
  const cmp=(a,b)=>String(a.name||'').localeCompare(String(b.name||''),'pt-BR',{sensitivity:'base'});
  const exact=[],starts=[],contains=[];
  for(const a of ev.attendees){
    const n=norm(a.name),cd=norm(a.code),ph=norm(a.phone),tb=norm(a.table).trim();
    if(mq&&!(tb===mq||tb.includes(mq)))continue;
    if(!q){(tb===mq?exact:contains).push(a);continue}
    if(n.startsWith(q)||cd.startsWith(q))starts.push(a);
    else if(n.includes(q)||ph.includes(q)||cd.includes(q))contains.push(a);
  }
  const res=exact.sort(cmp).concat(starts.sort(cmp)).concat(contains.sort(cmp)).slice(0,12);
  if(!res.length){box.innerHTML='<div class="hint">Ninguém encontrado. Ajuste o nome/mesa ou cadastre a pessoa na lista.</div>';return}
  box.innerHTML=res.map(a=>`<div class="scan-item"><b>${esc(a.name)}${a.table?` <button class="chip" style="cursor:pointer;font:inherit" data-m="${esc(a.table)}" onclick="setScanMesa(this.dataset.m)" title="Ver todos desta mesa">🪑 ${esc(a.table)}</button>`:''}<br><span class="hint">${esc(a.category||'')}${a.category?' • ':''}${esc(a.code)}</span></b>${a.status==='present'?'<span class="chip ok">✓ entrou</span>':`<button class="btn btn-sm btn-pri" onclick="confirmByCode('${a.code}')">Confirmar</button>`}</div>`).join('');
}
function scanEnter(e){if(e.key!=='Enter')return true;try{e.preventDefault()}catch(_){}const b=$('#ssearch')?$('#ssearch').querySelectorAll('button.btn-pri'):[];if(b.length===1){b[0].click()}else{const qi=$('#scanq');if(qi)qi.blur()}return false}
function setScanMesa(m){const mi=$('#scanmesa');if(mi){if(![...mi.options].some(o=>o.value===m)){const o=document.createElement('option');o.value=m;o.textContent='🪑 Mesa '+m;mi.appendChild(o)}mi.value=m}const qi=$('#scanq');if(qi)qi.value='';scanSearch()}
function clearScanMesa(){const mi=$('#scanmesa');if(mi)mi.value='';scanSearch()}
function confirmByCode(code){
  const ev=getEvent(SC.eventId);if(!ev)return;
  const a=getAtt(ev,code);if(!a)return;
  const box=$('#sres');const mesa=a.table||'';
  if(a.status==='present'){beep(false);
    box.innerHTML=`<div class="scan-result dup"><h2>⚠️ Já entrou!</h2><p><b style="font-size:20px">${esc(a.name)}</b></p>${mesa?`<div style="font-size:30px;font-weight:800;margin:4px 0">🪑 Mesa ${esc(mesa)}</div>`:''}<p>Entrada às ${fmtDT(a.checkedInAt)}</p></div>`;
    pushRecent(`⚠️ ${a.name} — duplicado`);renderRecent();return}
  a.status='present';a.checkedInAt=Date.now();save();beep(true);if(navigator.vibrate)navigator.vibrate(80);
  box.innerHTML=`<div class="scan-result ok"><h2>✅ Bem-vindo(a)!</h2><p><b style="font-size:24px">${esc(a.name)}</b><br>${esc(a.category||'Convidado')} • <span class="code">${esc(a.code)}</span></p>${mesa?`<div style="font-size:34px;font-weight:800;margin:4px 0">🪑 Mesa ${esc(mesa)}</div>`:`<div class="hint">sem mesa definida</div>`}<p>Entrada: ${fmtDT(a.checkedInAt)}</p></div>`;
  pushRecent(`✅ ${a.name}${mesa?' — Mesa '+mesa:''}`);renderRecent();
  cloudUpdateScanStats();
  const si=$('#scanq');if(si){si.value='';scanSearch()}
}
cloudInit();
</script>
